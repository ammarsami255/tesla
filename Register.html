<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="stylesheet" href="Register.css" />
  <title>TESLA - Register</title>
  <link rel="icon" href="imgs/R.png" sizes="16x16" type="image/x-icon" />

  <style>
    .password-group {
      position: relative;
    }

    .toggle-password {
      position: absolute;
      right: 12px;
      transform: translateX(-70%);
      background: transparent;
      width: 10px;
      border: none;
      color: #00f;
      cursor: pointer;
      font-size: 1em;
    }
  </style>
</head>

<body class="bg">
  <div class="container">
    <div class="login-box">
      <div class="login-tab">Register</div>
      <form id="registerForm">
        <div class="input-group">
          <input type="text" name="name" placeholder="Full Name" required />
          <span class="icon"></span>
        </div>

        <div class="input-group">
          <input type="email" name="email" placeholder="Email" required />
          <span class="icon"></span>
        </div>

        <div class="input-group password-group">
          <input type="password" name="password" placeholder="Password" required minlength="8" />
          <button type="button" class="toggle-password">🙉</button>
        </div>

        <div class="input-group password-group">
          <input type="password" name="confirmPassword" placeholder="Confirm Password" required />
          <button type="button" class="toggle-password">🙉</button>
        </div>

        <div class="options">
          <label><input type="checkbox" required /> I agree to the terms and conditions</label>
        </div>

        <button type="submit">Register</button>
        <p class="register">Already have an account? <a href="login.html">Login</a></p>
      </form>
    </div>
  </div>

  <script>
    document.getElementById('registerForm').addEventListener('submit', function(e) {
      e.preventDefault();

      const formData = new FormData(this);

      fetch('register.php', {
        method: 'POST',
        body: formData
      })
      .then(response => response.json())
      .then(data => {
        if (data.success) {
          window.location.href = data.redirect;
        } else {
          data.errors.forEach(error => {
            alert(error);
          });
        }
      })
      .catch(error => {
        console.error('Error:', error);
        alert('An error occurred during registration');
      });
    });

    document.querySelectorAll(".toggle-password").forEach((btn) => {
      btn.addEventListener("click", function () {
        const input = this.previousElementSibling;
        if (input.type === "password") {
          input.type = "text";
          this.textContent = "🙈";
        } else {
          input.type = "password";
          this.textContent = "🙉";
        }
      });
    });
  </script>
</body>
</html>
